<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            min-height: 45px;
            margin: 0 0 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f6f8;
            color: #222;
            font-size: 24px;
            text-align: center;
            word-break: break-word;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="value"></h1>
        <input id="message" placeholder="print your message here">
        <button id="updateMessageBtn">Update</button>
    </div>
    <script>
        const valueElement = document.getElementById("value");
        valueElement.innerText = localStorage.getItem("message")
        document.getElementById("updateMessageBtn").addEventListener("click", () => {
            const value = document.getElementById("message").value;
            valueElement.innerText = value;
            localStorage.setItem("message", value);
        });
        window.addEventListener("storage", (e) => {
            if (e.key === "message") {
                valueElement.innerText = e.newValue;
            }
        })
    </script>
</body>

</html>
