<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <video></video>
    <script>
        async function test() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            const vid = document.querySelector('video');
            vid.srcObject = stream;
            vid.play();
        }
        test();
    </script>
</body>

</html>
